[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-adaptive-fusion"
version = "0.1.0"
description = "Research infrastructure for heterogeneous partial-discharge classifiers and adaptive fusion."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
poc = [
    "torch>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyarrow",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "nbclient>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires manually transferred local raw datasets",
]

[tool.ruff]
line-length = 100
target-version = "py310"
