config_version: two-dataset-confirmatory-v4-windowed-localraw
parent_config_version: two-dataset-confirmatory-v3-windowed-localraw
protocol_status: development_selection
preprocessing_version: representation-aware-mi-v4
objective: Develop and gate stronger representation-aware MATLAB/VSB experts before confirmatory evaluation
data_source:
  type: local_raw
  root_environment_variable: PD_RAW_DATA_ROOT
  default_relative_root: data/raw
datasets:
  engineering-partial-discharge-noise-signals:
    version: v1
    role: matlab_pd_noise
    local_directory: dataset-pd-noise
    train: Tr1.mat
    validation: Va1.mat
    secondary_test: Te1.mat
    confirmatory_test: Te2.mat
    input_policy:
      status: candidate
      temporal: standardized_400_sample_signal
      cwt: morlet_log_power_32_scales_120_time_bins
      multi_instance:
        window_length: 400
        stride: 400
        n_windows: 1
        aggregation: max
        loss_unit: parent_signal
    grouping: source_partitions; no per-sample group ID is available
  engineering-vsb-power-line-fault-detection:
    version: 2018-kaggle-snapshot
    role: vsb_pd
    local_directory: dataset-vsb-power-line-fault-detection
    labeled_source: train.parquet + metadata_train.csv
    official_test: excluded_from_scientific_metrics_because_unlabeled
    input_policy:
      status: candidate
      decision_basis: v4_development_gate_seeds_42_43_44
      temporal:
        input: signal_windows
        signal_length: 800000
        sampling_frequency_hz: 40000000.0
        window_length: 16384
        stride: 8192
        window_count: 97
        window_duration_seconds: 0.0004096
        padding: none
        normalization: z_score_fit_on_train_only
        aggregation: top_k_mean
        top_k_fraction: 0.1
      cwt:
        input: signal_windows
        signal_length: 800000
        sampling_frequency_hz: 40000000.0
        window_length: 16384
        stride: 8192
        window_count: 97
        window_duration_seconds: 0.0004096
        padding: none
        normalization: z_score_fit_on_train_only
        aggregation: top_k_mean
        top_k_fraction: 0.1
        wavelet: complex_morlet
        morlet_w0: 6.0
        n_scales: 32
        scales_min: 1.5
        scales_max: 64.0
        time_bins: 120
        transform: log_power
        clip_floor: -10.0
        pseudo_frequency_range_hz: [596831.0366, 25464790.8947]
      test_results_used: false
      preprocessing_version: representation-aware-mi-v4
    grouping: id_measurement
    outer_split: StratifiedGroupKFold, five folds; folds 0/1/2-4 = test/validation/train
splits:
  split_seed: 42
  oof_folds: 5
  preserve_source_matlab_partitions: true
  vsb_group_column: id_measurement
  vsb_target_holdout_approximation: 60_percent_train_20_percent_validation_20_percent_test
seeds: [42, 43, 44, 45, 46]
experts:
  temporal_kind: geometry_adapted_temporal
  cwt_kind: geometry_adapted_cwt
  temporal:
    architecture: V4MultiScaleTemporalCNN
    channels: [32, 32, 32]
    context: local_and_coarse_within_window
    optimizer: Adam
    learning_rate: 0.001
    weight_decay: 0.0001
    loss: BCEWithLogitsLoss
  cwt:
    architecture: V4ResidualCWT2DCNN
    channels: [24, 48]
    optimizer: Adam
    learning_rate: 0.001
    weight_decay: 0.0001
    loss: BCEWithLogitsLoss
  epochs:
    temporal: 9
    cwt: 5
  batch_size: 4
  inference_batch_size: 4
  gradient_accumulation_steps: 1
  instance_microbatch_size: 16
  imbalance:
    matlab: none_balanced_partitions
    vsb: fold_local_pos_weight
fusion:
  fixed_weight_grid: 0.0_to_1.0_step_0.05
  threshold_grid: 0.05_to_0.95_step_0.005
  reliability_models: [logistic, hist_gradient_boosting, small_mlp]
  reliability_selection: validation_brier_then_roc_auc
  conservative_delta_grid: [0.0, 0.02, 0.05, 0.1, 0.15, 0.2, 0.25]
  reliability_weight_formula: r_i_divided_by_sum_reliability_plus_epsilon
evaluation:
  primary_metric: MCC
  secondary_metrics: [accuracy, precision, recall_pd, specificity, f1, pr_auc, roc_auc, brier, ece]
  paired_bootstrap_iterations_per_seed: 10000
  mcnemar: exact_two_sided
  adaptive_target_delta_mcc: 0.005
protection:
  cuda_required_for_training: true
  cpu_fallback: forbidden
  te2_before_protocol_freeze: forbidden
  vsb_holdout_before_gate: forbidden
  official_unlabeled_test_access: forbidden
  test_tuning: forbidden
  external_vsb_weights: forbidden
selection:
  development_seeds: [42, 43, 44]
  allowed_split: train_and_validation_only
  blocked_splits: [test, test_confirmatory, official_unlabeled_test]
  gate:
    pass_mean_best_individual_mcc: 0.70
    stop_mean_best_individual_mcc: 0.60
    stop_if_any_seed_best_individual_mcc_at_or_below: 0.60
    preferred_mean_best_individual_mcc: 0.75
  model_candidates:
    v3_control:
      temporal_kind: temporal
      cwt_kind: cwt
      compute_cost: 1.0
    geometry_adapted:
      temporal_kind: geometry_adapted_temporal
      cwt_kind: geometry_adapted_cwt
      compute_cost: 2.0
  selection_rule: [highest_mean_best_individual_mcc, highest_minimum_expert_mcc, lowest_compute_cost]
cycle_reference:
  audit_required: true
  cycle_consistency_default: disabled_until_phase_alignment_is_proven
outputs:
  results_root: results/runs/v4-windowed
  cache_root: results/cache/v4-windowed
  manifest_root: results/manifests
  reports_root: reports
  development_gate_summary: reports/metrics/v4-windowed/development_gate.json
  frozen_config: configs/experiments/two-dataset-confirmatory-v4-windowed-localraw-frozen.yaml
  metrics_namespace: v4-windowed
  statistical_namespace: v4-windowed
  predictions_format: parquet
  summaries_format: csv_json_yaml
runtime:
  num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  mixed_precision: false
  equivalence_required: true
environment: partial-discharge
device_policy: cuda_required
