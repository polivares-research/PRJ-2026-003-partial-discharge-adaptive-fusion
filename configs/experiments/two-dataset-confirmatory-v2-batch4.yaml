config_version: two-dataset-confirmatory-v2-batch4
parent_config_version: two-dataset-confirmatory-v1
protocol_status: frozen
objective: Run the confirmatory comparison with a common physical batch of four on the available GPU.
amendment:
  reason: The frozen native VSB temporal representation exceeds the local GPU memory at batch 128.
  physical_batch_size: 4
  effective_batch_size: 4
  gradient_accumulation_steps: 1
  applies_to: [MATLAB_temporal, MATLAB_CWT, VSB_temporal, VSB_CWT]
  selected_before_new_evaluation: true
catalog:
  environment_variable: PD_DATASETS_CATALOG_ROOT
datasets:
  engineering-partial-discharge-noise-signals:
    version: v1
    role: matlab_pd_noise
    train: Tr1.mat
    validation: Va1.mat
    secondary_test: Te1.mat
    confirmatory_test: Te2.mat
    input_policy:
      status: frozen
      temporal: standardized_400_sample_signal
      cwt: morlet_log_power_32_scales_120_time_bins
    grouping: source_partitions; no per-sample group ID is available
  engineering-vsb-power-line-fault-detection:
    version: 2018-kaggle-snapshot
    role: vsb_pd
    labeled_source: train.parquet + metadata_train.csv
    official_test: excluded_from_scientific_metrics_because_unlabeled
    input_policy:
      status: frozen
      decision_basis: native Parquet schema and catalog sampling metadata
      temporal:
        input: native_signal
        signal_length: 800000
        sampling_frequency_hz: 40000000
        normalization: z_score_fit_on_train_only
        resampling: none
        window: none
      cwt:
        input: native_signal
        wavelet: complex_morlet
        morlet_w0: 6.0
        n_scales: 32
        scales_min: 1.5
        scales_max: 64.0
        time_bins: 120
        transform: log_power
        clip_floor: -10.0
        normalization: z_score_fit_on_train_only
      test_results_used: false
    grouping: id_measurement
    outer_split: StratifiedGroupKFold, five folds; folds 0/1/2-4 = test/validation/train
splits:
  split_seed: 42
  oof_folds: 5
  preserve_source_matlab_partitions: true
  vsb_group_column: id_measurement
  vsb_target_holdout_approximation: 60_percent_train_20_percent_validation_20_percent_test
seeds: [42, 43, 44, 45, 46]
experts:
  temporal:
    architecture: TinyTemporalCNN
    channels: [16, 32, 64]
    kernels: [7, 5, 5]
    optimizer: Adam
    learning_rate: 0.001
    weight_decay: 0.0001
    loss: BCEWithLogitsLoss
  cwt:
    architecture: SmallCWT2DCNN
    channels: [16, 32, 64]
    kernels: [[3, 3], [3, 3], [3, 3]]
    optimizer: Adam
    learning_rate: 0.001
    weight_decay: 0.0001
    loss: BCEWithLogitsLoss
  epochs:
    temporal: 9
    cwt: 5
  batch_size: 4
  inference_batch_size: 4
  gradient_accumulation_steps: 1
  imbalance:
    matlab: none_balanced_partitions
    vsb: fold_local_pos_weight_or_balanced_batches
fusion:
  fixed_weight_grid: 0.0_to_1.0_step_0.05
  threshold_grid: 0.05_to_0.95_step_0.005
  reliability_models: [logistic, hist_gradient_boosting, small_mlp]
  reliability_selection: validation_brier_then_roc_auc
  conservative_delta_grid: [0.0, 0.02, 0.05, 0.1, 0.15, 0.2, 0.25]
  reliability_weight_formula: r_i_divided_by_sum_reliability_plus_epsilon
evaluation:
  primary_metric: MCC
  secondary_metrics: [accuracy, precision, recall_pd, specificity, f1, pr_auc, roc_auc, brier, ece]
  paired_bootstrap_iterations_per_seed: 10000
  mcnemar: exact_two_sided
  adaptive_target_delta_mcc: 0.005
  strong_adaptive_consistency: at_least_4_of_5_positive_seeds_and_ci_above_zero
outputs:
  results_root: results/runs
  manifest_root: results/manifests
  reports_root: reports
  predictions_format: parquet
  summaries_format: csv_json_yaml
protection:
  cuda_required_for_training: true
  cpu_fallback: forbidden
  te2_before_protocol_freeze: forbidden
  test_tuning: forbidden
freeze_record:
  amendment: batch4_common_physical_batch_selected_before_new_evaluation
  parent: two-dataset-confirmatory-v1-frozen.yaml
  input_policy_source: results/manifests/vsb_input_policy.json
